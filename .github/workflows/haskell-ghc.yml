# Builds the Haskell pack's GHC root file system (GHC 9.14 for WebAssembly,
# its libraries as shared libraries, and the pack's GHC API program) with
# prototypes/monaco-lsp/packs/haskell/ghc/build-rootfs.sh, smoke-tests it in
# Node, and uploads it as an artifact for the pack's build.sh. GHC's wasm
# toolchain needs some 3 GB of disk, more than a pack build should ask of a
# laptop.
name: Haskell pack GHC root file system

on:
  push:
    branches:
      - claude/project-thread-3ei4fl
    paths:
      - prototypes/monaco-lsp/packs/haskell/ghc/**
      - .github/workflows/haskell-ghc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Cache GHC's wasm toolchain and the package store
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm
            /tmp/yk/store
          key: ghc-wasm-${{ hashFiles('prototypes/monaco-lsp/packs/haskell/ghc/build-rootfs.sh') }}
          restore-keys: ghc-wasm-

      - name: Install brotli
        run: sudo apt-get install -y --no-install-recommends brotli

      - name: Build
        run: prototypes/monaco-lsp/packs/haskell/ghc/build-rootfs.sh "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haskell-ghc-rootfs
          path: ${{ runner.temp }}/out
          retention-days: 30

  # ormolu and hlint as WebAssembly commands (ghc/build-tools.sh), for the
  # language server's formatting and hints.
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Cache GHC's wasm toolchain and the tools' package store
        uses: actions/cache@v4
        with:
          path: |
            ~/.ghc-wasm
            /tmp/yk/tools-store
          key: ghc-wasm-tools-${{ hashFiles('prototypes/monaco-lsp/packs/haskell/ghc/build-tools.sh') }}
          restore-keys: ghc-wasm-tools-

      - name: Build
        run: prototypes/monaco-lsp/packs/haskell/ghc/build-tools.sh "$RUNNER_TEMP/tools"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: haskell-ghc-tools
          path: ${{ runner.temp }}/tools
          retention-days: 30
