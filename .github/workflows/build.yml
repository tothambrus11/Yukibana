# Adapted from https://github.com/eclipse-theia/theia-ide/blob/74bd976ef60102bdbaf754817c88d00811465e72/.github/workflows/build.yml
name: Build, package and test

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - '**/*.md'
      - '**/*.typ'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.typ'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.x
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm ci --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The root package has no postinstall: the version check runs here, from the root, where every @theia/* package is.
      - name: Check Theia versions
        run: pnpm run check:theia

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Unit tests
        run: pnpm test:coverage

      # The library the IDE builds from this repository, and the CLI over it, keep their own checks until PR 3 brings
      # them into the root's; PR 5's per-package CI replaces this step.
      - name: Check the client library and the CLI
        run: |
          pnpm --filter @yukibana/client run typecheck
          pnpm --filter @yukibana/client run lint
          pnpm --filter @yukibana/client test
          npm --prefix packages/cli ci
          npm --prefix packages/cli run typecheck
          npm --prefix packages/cli run lint
          npm --prefix packages/cli test
          npm --prefix packages/cli run build
          mkdir -p "$RUNNER_TEMP/fixture"
          tar -xzf packages/client/tests/fixtures/repo.tar.gz -C "$RUNNER_TEMP/fixture" --strip-components=1
          node packages/cli/dist/index.js check "$RUNNER_TEMP/fixture" --folder calc

      # The cloud's Worker, with the old repository's npm scripts until PR 3; PR 5's per-package CI replaces this step.
      - name: Check the cloud web app
        run: |
          npm --prefix cloud/web ci
          npm --prefix cloud/web run typecheck
          npm --prefix cloud/web run lint
          npm --prefix cloud/web test
          npm --prefix cloud/web run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 5

  e2e:
    name: E2E tests (${{ matrix.app }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        app: [browser, electron]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.x
          cache: true
          install: false

      - name: Install dependencies
        shell: bash
        run: pnpm ci --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      # Not cached, as Playwright recommends: restoring takes about as long as downloading.
      - name: Install Playwright Chromium
        if: matrix.app == 'browser'
        shell: bash
        run: pnpm --filter yukibana-tests exec playwright install --with-deps chromium

      # Builds both apps and downloads the plugins first.
      - name: E2E tests
        shell: bash
        # Electron needs a display, which Linux runners lack.
        run: ${{ matrix.app == 'electron' && runner.os == 'Linux' && 'xvfb-run -a' || '' }} pnpm test:e2e --project=${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.app }}-${{ matrix.os }}
          path: |
            ide/e2e/playwright-report/
            ide/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 5

  package:
    name: Package (${{ matrix.artifact }})
    needs: [check, e2e]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, artifact: windows }
          - { os: ubuntu-22.04, artifact: linux }
          - { os: macos-15, artifact: mac-arm64 }
          - { os: macos-15-intel, artifact: mac-x64 }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.x
          cache: true
          install: false

      - name: Install dependencies
        shell: bash
        run: pnpm ci --fetch-timeout 100000
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Theia plugins
        uses: actions/cache@v6
        with:
          # With the stamp that pnpm download:plugins compares the plugin list with.
          path: |
            ide/plugins
            node_modules/.plugins-download-inputs
          key: plugins-v2-${{ runner.os }}-${{ hashFiles('ide/package.json') }}

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ matrix.os }}-

      - name: Update electron-builder.yml for macos-15
        if: matrix.os == 'macos-15'
        run: |
          sed -i '' 's|https://yukibana.isc-vs.ch/download/latest/macos|https://yukibana.isc-vs.ch/download/latest/macos-arm|g' ide/electron/electron-builder.yml

      - name: Build prod package
        shell: bash
        run: |
          pnpm package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dist files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ide/electron/dist/**
            !ide/electron/dist/*-unpacked/**
            !ide/electron/dist/mac/**
            !ide/electron/dist/mac-arm64/**
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
