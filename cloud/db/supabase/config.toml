# The local Supabase stack, and what `supabase config push` sets on a linked
# project. Everything here is version controlled; secrets are env() references.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "yukibana"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# No grants by default: what an API role may read is what a migration granted
# it, and nothing more. The app itself never uses the Data API (see
# cloud/web/src/lib/server/db.ts); this keeps PostgREST honest for anyone who tries.
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the linked project's `show server_version`.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
# Migrations are written by hand; there are no declarative schema files.
schema_paths = []

[db.seed]
enabled = true
# Local only: the pgTAP helpers, then fixture people and a course.
sql_paths = ["./seeds/*.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
# Live pages: broadcasts on private channels, see 20261008110000_live_signals.sql.
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Locally, Auth's mail (the login codes) lands in this catcher instead of an
# inbox: http://127.0.0.1:54324. Production sends through Resend, declared
# under [remotes.production] below.
[local_smtp]
enabled = true
port = 54324

# Files live in R2 (or RustFS locally) over S3, not in Supabase Storage.
[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
# The CLI and a desktop IDE log in through the system browser and come back
# to a listener on the loopback, on whatever port was free
# (packages/client/src/loopback.ts). `*` matches the port. An IDE served from elsewhere
# that comes back to its own address needs that address here too.
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/callback", "http://127.0.0.1:*/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
# Per hour, project-wide. A class logging in by code at the start of a lab is
# thirty mails in a minute; Supabase's default of 2 is for its built-in
# mailer, which a deployed project does not use.
email_sent = 100
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

# A one-time code by email, beside GitHub (2026-10). No password and no link:
# the mail carries a code the login page asks for. `enable_signup` is the
# email provider itself, signing in included, not only new accounts.
# Confirmations on: an account a code creates is confirmed by that code and
# not before, since a confirmed address is what links enrolments. With them
# off, Auth confirms a new address the moment anyone asks for a code for it.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Both mails carry the code and no link. A new address gets the confirmation,
# a known one the magic link; to the person they are the same mail.
[auth.email.template.confirmation]
subject = "Your Yukibana login code"
content_path = "./supabase/templates/code.html"

[auth.email.template.magic_link]
subject = "Your Yukibana login code"
content_path = "./supabase/templates/code.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# GitHub is the identity provider. A GitHub OAuth App per environment; its
# callback URL is <auth url>/auth/v1/callback. See .env.example.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

# Auth as an OAuth 2.1 server, for one client: the registry's own, through
# which the CLI and the IDE log in by way of the website (/auth/connect, see
# cloud/web/src/lib/connect.ts). Auth sends the browser to site_url plus this path
# with the authorization to approve. The client is registered once per
# environment (`node cloud/dev/scripts/oauth-client.mjs`, docs/cloud/deploy.md), not here:
# clients are data, not settings. Nobody else may register one.
[auth.oauth_server]
enabled = true
authorization_url_path = "/auth/connect/consent"
allow_dynamic_registration = false

# Kept for the smoke test's health function, which proves the bind mount into
# the edge runtime works where the CLI runs. The app runs on Cloudflare.
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Per-project overrides for `supabase config push`. Everything above is the
# local stack; this is what production differs by. Replace the ref with the
# project's own, which is the first label of its API URL.
[remotes.production]
project_id = "zfklzzixyseiyhszkojf"

[remotes.production.auth]
site_url = "https://cloud.yukibana.dev"
additional_redirect_urls = ["https://cloud.yukibana.dev/auth/callback", "http://127.0.0.1:*/callback"]

# The login codes, sent through Resend. Not optional: Supabase's own mailer
# reaches only the organisation's members, and on the free plan it refuses
# any template but its own, which rejected the whole auth push the first time
# (2026-10). The sender's domain is verified in Resend; the API key is the
# password, a deploy secret.
[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "login@yukibana.dev"
sender_name = "Yukibana"
